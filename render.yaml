services:
  - type: web
    name: module3-feedback-board
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn feedback_board.main:app --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: FEEDBACK_LIMIT
        value: "500"
      - key: WRITE_LIMIT
        value: "10"
